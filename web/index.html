<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Türkçe hızlı okuma uygulaması: metni kelime kelime, odak harfiyle göster ve daha hızlı oku. İki Şehrin Hikâyesi, Dönüşüm ve Kur'an-ı Kerim hazır kütüphanede.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RapidReader">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RapidReader: Hızlı Okuma</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Flutter's web engine throws on an invalid browser language tag (some
    // Linux setups report "en-US@posix") and the page stays blank, so only
    // pass on valid tags.
    (function () {
      try {
        var languages = navigator.languages || [];
        var valid = languages.filter(function (tag) {
          try { new Intl.Locale(tag); return true; } catch (e) { return false; }
        });
        if (valid.length !== languages.length) {
          if (valid.length === 0) valid = ['tr-TR'];
          Object.defineProperty(navigator, 'languages', { get: function () { return valid; } });
          Object.defineProperty(navigator, 'language', { get: function () { return valid[0]; } });
        }
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
