name: Release

# Signed app bundle for Google Play, started by hand: Actions > Release >
# Run workflow. The bundle is attached to the run as an artifact and, when
# the Play key below is set, released on Play's production track with the
# notes in store/whatsnew/.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   UPLOAD_KEYSTORE_BASE64     the upload keystore (.jks), base64 encoded
#   KEY_PROPERTIES             the contents of android/key.properties
#   PLAY_SERVICE_ACCOUNT_JSON  optional: the JSON key of a Google Cloud
#                              service account invited in Play Console
#                              (Users and permissions) with release rights
# The keystore is written to the runner only and never committed.

on:
  workflow_dispatch:

jobs:
  appbundle:
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Signing key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::Add the UPLOAD_KEYSTORE_BASE64 and KEY_PROPERTIES repository secrets"
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > android/upload-keystore.jks
          # The keystore path of the Windows copy does not exist here
          printf '%s\n' "$KEY_PROPERTIES" | tr -d '\r' | grep -v '^storeFile' > android/key.properties
          echo 'storeFile=../upload-keystore.jks' >> android/key.properties
      - run: flutter build appbundle --release
      - name: Check the target API
        run: |
          # The lowest target in the app's merged manifests
          target=$(grep -rhoE --include=AndroidManifest.xml 'targetSdkVersion="[0-9]+"' build/app/intermediates \
            | grep -oE '[0-9]+' | sort -n | sed -n 1p)
          echo "Target API: ${target:-not found}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$target" ] || [ "$target" -lt 36 ]; then
            echo "::error::Google Play needs target API 36 or higher (found $target)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Release on Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rapidreader.rapid_reader
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: store/whatsnew
