name: rapid_reader
description: "RSVP Speed Reading App for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # File Parsing
  epubx: ^4.0.0
  syncfusion_flutter_pdf: ^25.1.37
  file_picker: ^8.0.0

  # Utilities
  crypto: ^3.0.3
  equatable: ^2.0.5

  # Keep the screen on while reading
  wakelock_plus: 1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  archive: ^3.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  # Bundled so the RSVP display works offline and in release builds
  # (Android release builds have no INTERNET permission)
  fonts:
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
