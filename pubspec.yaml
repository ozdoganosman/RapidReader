name: rapid_reader
description: "RSVP Speed Reading App for Android"
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # File import (TXT/PDF/EPUB) for custom texts
  file_picker: ^13.1.0
  epubx: ^4.0.0
  syncfusion_flutter_pdf: ^33.2.13

  # UI
  google_fonts: ^8.2.1

  # Utilities
  uuid: ^4.3.3
  equatable: ^3.0.0
  shared_preferences: ^2.2.2
  # Custom texts (IndexedDB on web, so large texts fit)
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  image_picker: ^1.0.7

  # Keep the screen on while reading
  wakelock_plus: ^1.2.8

  # Ads
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  archive: ^3.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/books.json
    - assets/books/
    # Default reading font, bundled so it works offline (google_fonts uses
    # these files instead of downloading RobotoMono-Regular/Bold)
    - assets/google_fonts/
