name: rapid_reader
description: "RSVP Speed Reading App for Android"
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # File Parsing (TXT/PDF/EPUB import, not wired to the UI at the moment)
  epubx: ^4.0.0
  syncfusion_flutter_pdf: ^25.1.37

  # UI
  google_fonts: ^6.2.0

  # Utilities
  uuid: ^4.3.3
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7

  # Keep the screen on while reading
  wakelock_plus: 1.2.8

  # Ads
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  archive: ^3.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/books.json
    - assets/books/
    # Default reading font, bundled so it works offline (google_fonts uses
    # these files instead of downloading RobotoMono-Regular/Bold)
    - assets/google_fonts/
