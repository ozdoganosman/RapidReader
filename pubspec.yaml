name: rapid_reader
description: "RSVP Speed Reading App for Android"
publish_to: 'none'
version: 1.2.0+10

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  # Turkish and English UI (lib/l10n)
  flutter_localizations:
    sdk: flutter
  intl: any

  # File import (TXT/PDF/EPUB) for custom texts
  file_picker: ^13.1.0
  epubx: ^4.0.0
  syncfusion_flutter_pdf: ^33.2.13

  # UI
  google_fonts: ^8.2.1

  # Utilities
  uuid: ^4.3.3
  equatable: ^3.0.0
  shared_preferences: ^2.2.2
  # Custom texts (IndexedDB on web, so large texts fit)
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  image_picker: ^1.0.7

  # Keep the screen on while reading
  wakelock_plus: ^1.2.8

  # Ads
  google_mobile_ads: ^9.1.0
  receive_sharing_intent: ^1.9.0
  http: ^1.6.0
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  archive: ^3.6.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/books.json
    - assets/books/
    # English library (the app in English)
    - assets/books/en/
    # Arabic Quran text (Tanzil Project), one file per surah
    - assets/quran/
    # Speed test passages and exam practice paragraphs
    # Default reading font, bundled so it works offline (google_fonts uses
    # these files instead of downloading RobotoMono-Regular/Bold)
    - assets/google_fonts/
    - assets/fonts/AmiriQuran-OFL.txt
    - assets/fonts/OpenDyslexic-LICENSE.txt

  fonts:
    # Arabic Quran text and Arabic words in titles (SIL OFL 1.1, assets/fonts/AmiriQuran-OFL.txt)
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    # Dyslexia-friendly reading font (Bitstream Vera based license, assets/fonts/OpenDyslexic-LICENSE.txt)
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.ttf
        - asset: assets/fonts/OpenDyslexic-Bold.ttf
          weight: 700
